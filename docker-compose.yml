services:
  db:
    image: postgres:17-alpine
    container_name: sql-bancario-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sql_bancario
    ports:
      - '5437:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d sql_bancario']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: